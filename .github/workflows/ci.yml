name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-gate:
    name: Spec and community contract gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run contract gate
        run: python -B scripts/check_repo.py --root .

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sandbox static scan (AT-006 layer 2)
        run: npm run build && npm run sandbox:scan

  test-matrix:
    name: AT matrix (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Sandbox static scan
        run: npm run sandbox:scan

      - name: SC-001 cold-start bench (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run bench

      - name: End-to-end stdio validation (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run e2e

      - name: Run acceptance tests (AT-001..AT-012)
        run: npm run test
